name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  production:
    name: Build release and deploy
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, xml, dom, fileinfo
          coverage: none
          tools: composer:v2

      - name: Prepare Laravel release folders
        shell: bash
        run: |
          mkdir -p storage/framework/{cache/data,sessions,views} storage/logs bootstrap/cache
          chmod -R u+rwX storage bootstrap/cache

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build frontend assets
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          npm run build

      - name: Prepare production package
        shell: bash
        run: |
          rm -f .env
          rm -rf node_modules
          mkdir -p release
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='database/database.sqlite' \
            --exclude='database/dast.sqlite' \
            --exclude='storage/logs/*' \
            --exclude='release' \
            -czf release/alerte-catastrophe-release.tar.gz .

      - name: Upload production artifact
        uses: actions/upload-artifact@v7
        with:
          name: alerte-catastrophe-production
          path: release/alerte-catastrophe-release.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Trigger Render deployment when configured
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "No Render deploy hook configured; artifact build completed successfully."
            exit 0
          fi

          curl --fail --show-error --silent \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}"
          echo "Render deployment triggered successfully."
